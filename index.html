<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>teachablemachine coloring</title>
  <link rel="stylesheet" href="style.css" />
  <script src="./modules/p5/lib/p5.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
  <script src="index.js" defer></script>
</head>
<body>

  <div class="textBox">
    <h1>Teachablemachine</h1>
    <h2><pre>Show a color to the webcam, 
  then click an image to color it in.</pre></h2>
    <div id="label-output">Detecting color...</div>
  </div>

  <div id="bildschirm" class="bildschirm">
    <div id="p5-container"></div>

    <object id="bubble" type="image/svg+xml" data="images/bubble.svg" width="250" height="100"></object>
    <object id="fishes-1" type="image/svg+xml" data="images/fishes-1.svg" width="200" height="100"></object>
    <object id="fishes-2" type="image/svg+xml" data="images/fishes-2.svg" width="100" height="50"></object>
    <object id="fishes" type="image/svg+xml" data="images/fishes.svg" width="400" height="300"></object>
  
    
  </div>

  <!-- <audio id="correct-sound" src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"></audio> -->
  <!-- <audio id="wrong-sound" src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"></audio>

</body>
</html>
